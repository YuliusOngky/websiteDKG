<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand — PT Diana Karya Gemilang</title>
<meta name="description" content="Brand detail — PT Diana Karya Gemilang">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="detail.css">
</head>
<body>
  <header class="detail-top">
    <div class="wrap detail-nav">
      <a class="logo" href="index.html" aria-label="PT Diana Karya Gemilang">
        <img
          src="images/logo-dkg-nav-2x.png"
          srcset="images/logo-dkg-nav-1x.png 1x, images/logo-dkg-nav-2x.png 2x, images/logo-dkg-nav-3x.png 3x"
          alt="PT Diana Karya Gemilang"
          height="28"
          decoding="async"
        >
      </a>
      <div class="detail-actions">
        <a class="detail-header-back back-link" href="index.html#brands" data-detail-back hidden>
          <span class="back-arrow" aria-hidden="true">←</span>
          <span data-i18n="ui.back">Back</span>
        </a>
        <div class="lang-switch">
          <button type="button" data-lang="en" class="active">EN</button>
          <button type="button" data-lang="id">ID</button>
        </div>
      </div>
    </div>
  </header>

  <main class="detail-main wrap" id="detailRoot">
    <p class="detail-loading">Loading…</p>
  </main>

  <script src="i18n.js"></script>
  <script src="media-ui.js"></script>
  <script src="detail.js"></script>
  <script>
    DKGDetail.mount({
      type: 'brand',
      collection: 'brands',
      backHref: 'index.html#brands',
      render(item, l, bi, esc) {
        const cat = bi(item.category, l);
        const body = bi(item.body, l);

        function formatWebsiteDisplay(url) {
          let display = url;
          try {
            const u = new URL(url);
            let host = u.hostname.toLowerCase();
            if (!host.startsWith('www.')) host = 'www.' + host;
            const path = u.pathname.replace(/\/$/, '');
            display = host + (path && path !== '/' ? path : '');
          } catch (_) { /* keep raw */ }
          return display;
        }

        function formatInstagramHandle(url) {
          try {
            const u = new URL(url);
            const handle = u.pathname.replace(/^\/+|\/+$/g, '').split('/')[0];
            if (!handle) return '';
            return handle.charAt(0).toUpperCase() + handle.slice(1);
          } catch (_) {
            return String(url || '').replace(/^@/, '');
          }
        }

        function websiteBlock(url) {
          const href = String(url || '').trim();
          if (!href) return '';
          return `
          <div class="brand-visit-web">
            <p class="brand-visit-label">${esc(DKGMedia.t('detail.visitWebsite'))}</p>
            <p class="brand-visit-line">
              <a class="brand-visit-url" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(formatWebsiteDisplay(href))}</a>
            </p>
          </div>`;
        }

        function instagramBlock(url) {
          const href = String(url || '').trim();
          if (!href) return '';
          const handle = formatInstagramHandle(href);
          if (!handle) return '';
          const igGlyph = `<img class="brand-ext-logo" src="images/instagram-icon.svg" alt="Instagram" width="40" height="40">`;
          return `
          <div class="brand-visit-ig">
            <a class="brand-ext" href="${esc(href)}" target="_blank" rel="noopener noreferrer">
              ${igGlyph}
              <span class="brand-ext-url">${esc(formatWebsiteDisplay(href))}</span>
            </a>
            <div class="brand-visit-web">
              <p class="brand-visit-label">${esc(DKGMedia.t('detail.visitInstagram'))}</p>
              <p class="brand-visit-line">
                <a class="brand-visit-handle" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(handle)}</a>
              </p>
            </div>
          </div>`;
        }

        const websiteSection = websiteBlock(item.websiteUrl);
        const instagramSection = instagramBlock(item.instagramUrl);
        const externalBlock = (websiteSection || instagramSection)
          ? `<div class="brand-ext-stack">${websiteSection}${instagramSection}</div>`
          : '';

        const footerBlock = `
          <div class="detail-page-footer">
            <p class="detail-back-wrap">
              <a class="back-link back-link-below" href="index.html#brands">
                <span class="back-arrow" aria-hidden="true">←</span>
                <span data-back-label>${esc(DKGMedia.t('ui.back'))}</span>
              </a>
            </p>
            ${externalBlock}
          </div>`;

        return `
          <p class="eyebrow">${esc(cat || DKGMedia.t('detail.brand'))}</p>
          <h1>${esc(item.name || '')}</h1>
          ${item.image ? `<figure class="detail-hero"><img src="${esc(item.image)}" alt="${esc(item.name || '')}"></figure>` : ''}
          <div class="detail-body">${esc(body).replace(/\n/g, '<br>')}</div>
          ${footerBlock}
        `;
      }
    });
  </script>
</body>
</html>
