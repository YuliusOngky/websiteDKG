<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand — PT Diana Karya Gemilang</title>
<meta name="description" content="Brand detail — PT Diana Karya Gemilang">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="detail.css">
</head>
<body>
  <header class="detail-top">
    <div class="wrap detail-nav">
      <a class="logo" href="index.html">
        <img src="images/logo-dkg.png" alt="DKG" width="28" height="28">
        <span>PT Diana Karya Gemilang</span>
      </a>
      <div class="detail-actions">
        <div class="lang-switch">
          <button type="button" data-lang="en" class="active">EN</button>
          <button type="button" data-lang="id">ID</button>
        </div>
      </div>
    </div>
  </header>

  <main class="detail-main wrap" id="detailRoot">
    <p class="detail-loading">Loading…</p>
  </main>

  <script src="i18n.js"></script>
  <script src="media-ui.js"></script>
  <script src="detail.js"></script>
  <script>
    DKGDetail.mount({
      type: 'brand',
      collection: 'brands',
      backHref: 'index.html#brands',
      render(item, l, bi, esc) {
        const cat = bi(item.category, l);
        const body = bi(item.body, l);
        const igGlyph = `<img class="brand-ext-logo" src="images/instagram-icon.svg" alt="Instagram" width="40" height="40">`;

        function formatExtDisplay(url) {
          let display = url;
          try {
            const u = new URL(url);
            const path = u.pathname.replace(/\/$/, '');
            display = u.host.replace(/^www\./, '') + (path === '' || path === '/' ? '' : path);
          } catch (_) { /* keep raw */ }
          return display;
        }

        function extRow(opts) {
          const url = String(opts.url || '').trim();
          if (!url) return '';
          const logoSrc = String(opts.logo || '').trim();
          const mark = logoSrc
            ? `<img class="brand-ext-logo" src="${esc(logoSrc)}" alt="${esc(opts.alt || item.name || '')}">`
            : (opts.fallbackMark || `<span class="brand-ext-name">${esc(item.name || 'Link')}</span>`);
          return `
          <div class="brand-ext-wrap">
            <a class="brand-ext" href="${esc(url)}" target="_blank" rel="noopener noreferrer">
              ${mark}
              <span class="brand-ext-url">${esc(formatExtDisplay(url))}</span>
            </a>
          </div>`;
        }

        const websiteBlock = extRow({
          url: item.websiteUrl,
          logo: item.websiteLogo,
          alt: item.name || 'Website',
          fallbackMark: `<span class="brand-ext-name">${esc(item.name || 'Website')}</span>`
        });
        const instagramBlock = extRow({
          url: item.instagramUrl,
          logo: item.instagramLogo,
          alt: 'Instagram',
          fallbackMark: igGlyph
        });
        const externalBlock = (websiteBlock || instagramBlock)
          ? `<div class="brand-ext-stack">${websiteBlock}${instagramBlock}</div>`
          : '';

        return `
          <p class="eyebrow">${esc(cat || DKGMedia.t('detail.brand'))}</p>
          <h1>${esc(item.name || '')}</h1>
          ${item.image ? `<figure class="detail-hero"><img src="${esc(item.image)}" alt="${esc(item.name || '')}"></figure>` : ''}
          <div class="detail-body">${esc(body).replace(/\n/g, '<br>')}</div>
          ${externalBlock}
          <p class="detail-back-wrap">
            <a class="back-link back-link-below" href="index.html#brands">
              <span class="back-arrow" aria-hidden="true">←</span>
              <span data-back-label>${esc(DKGMedia.t('ui.back'))}</span>
            </a>
          </p>
        `;
      }
    });
  </script>
</body>
</html>
